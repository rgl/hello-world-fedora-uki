# see https://github.com/systemd/mkosi/blob/v26/mkosi/resources/man/mkosi.1.md#execution-flow
# see https://github.com/systemd/mkosi/blob/v26/mkosi/resources/man/mkosi.1.md#configuration-settings

# see https://github.com/systemd/mkosi/blob/v26/mkosi/resources/man/mkosi.1.md#distribution-section
[Distribution]
Distribution=fedora
Release=44

# see https://github.com/systemd/mkosi/blob/v26/mkosi/resources/man/mkosi.1.md#output-section
[Output]
Format=uki
# NB initrd is only split for debugging purposes. its not needed at runtime.
#    the .efi (uki) is the only file that is actually required.
SplitArtifacts=uki,initrd
OutputDirectory=../output
Output=hello-world

# see https://github.com/systemd/mkosi/blob/v26/mkosi/resources/man/mkosi.1.md#content-section
[Content]
Timezone=Europe/Lisbon
RootPassword=vagrant
Bootloader=none
KernelCommandLine=audit=0
WithRecommends=false
WithDocs=false
Packages=
    curl
    dbus
    efibootmgr
    iproute
    iputils
    kernel-core
    less
    openssh-server
    procps-ng
    systemd
    systemd-boot-unsigned
    systemd-networkd
    systemd-resolved
    tzdata
    util-linux
